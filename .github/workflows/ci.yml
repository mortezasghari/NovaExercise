name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore NovaExercise.slnx

      - name: Build
        run: dotnet build NovaExercise.slnx --no-restore --configuration Release -warnaserror

      - name: Test
        run: dotnet test NovaExercise.slnx --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Test on a single core
        run: dotnet test NovaExercise.slnx --no-build --configuration Release
        env:
          DOTNET_PROCESSOR_COUNT: "1"
